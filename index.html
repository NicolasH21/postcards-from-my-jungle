<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postcards from My Jungle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="intro">
    <h1>Postcards from<br>My Jungle</h1>
    <p class="description">
      Sixteen creatures. Sixteen voices. One imagined ecosystem.
    </p>
  </header>

  <main>
    <section class="postcard">
      <p id="counter">POSTCARD 01 / 16</p>
      <div id="animal-content">
        <p>Loading creatures...</p>
      </div>

      <nav class="controls" aria-label="Slideshow controls">
        <button id="previous" type="button">← Previous</button>
        <button id="play-sound" type="button">Play sound ♫</button>
        <button id="next" type="button">Next →</button>
      </nav>
    </section>
  </main>

  <footer>POSTCARDS FROM MY JUNGLE</footer>

  <script src="script.js"></script>
</body>
</html>
